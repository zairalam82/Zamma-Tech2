<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ZammaTech</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            background: rgba(0, 0, 22);

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

        }

        .register-container {
            width: 350px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        input {

            width: 105%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        a {
            color: blue;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        button:hover {
            background-color: rgba(0, 0, 22);
            color: aliceblue;
        }

        .register-container p {

            text-align: center;

            margin-top: 20px;

        }
        #role{
            color: aliceblue;
            width: 133px;
            padding: 8px;
            margin:6px;
            border: 1px solid black;
            font-size: 13px;
            border-radius: 15px;
            background-color: rgba(0, 0, 22);
        }
    </style>
</head>

<body>
    <div class="register-container">
        <h1>Registration Form</h1>
        <form id="registrationForm">

            <select id="role">
                <option value="user">Register as User</option>
                <option value="admin">Register as Admin</option>
            </select>

            <input type="text" id="user-name" placeholder="Full Name" required>

            <input type="email" id="email" placeholder="Email" required>

            <input type="password" id="password" placeholder="password" required>

            <input type="password" id="confirm-password" placeholder="confirm-password" required>


            <br>
            <button id="submit">Submit</button>
        </form>
        <p>
            If already have an Account.
            <a href="login.html">Login</a>
        </p>
    </div>


    <script>
        const form = document.getElementById("registrationForm");

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            const user_name = document.getElementById("user-name").value;
            const email = document.getElementById("email").value;
            const role=document.getElementById("role").value;
            const password = document.getElementById("password").value;
            const confirmpassword = document.getElementById("confirm-password").value;

            if (password !== confirmpassword) {
                alert("password does not match!")
                return;
            }

            const requestPromise = fetch("/api/users/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_name, email, password, role })
            });

            requestPromise
                .then((response) => {
                    return response.json().then((data) => {
                        return { data: data, ok: response.ok }
                    });

                })
                .then((result) => {
                    if (result.ok) {
                        alert(result.data.message);
                        if(role=="admin"){
                        window.location.href = "admin-login.html";
                        }else{
                        window.location.href = "user-login.html";   
                        }
                    } else {
                        alert(result.data.message);
                    }
                })
                .catch(function (error) {
                    console.log(error);
                    alert("Can't connect to server.");
                });

        });

    </script>

</body>

</html>
