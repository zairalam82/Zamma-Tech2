<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products | ZammaTech</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f4f4;
}

h1{
    text-align:center;
    margin:30px;
}

.container{
    width:90%;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.card{

    background:white;

    border-radius:10px;

    box-shadow:0 0 10px rgba(0,0,0,.2);

    overflow:hidden;

}

.card img{

    width:100%;

    height:220px;

    object-fit:cover;

}

.card-body{

    padding:15px;

}

.card h2{

    font-size:22px;

    margin-bottom:10px;

}

.price{

    color:green;

    font-size:20px;

    margin-bottom:10px;

}

.stock{

    color:#555;

    margin-bottom:15px;

}

button{

    width:100%;

    padding:10px;

    margin-top:8px;

    border:none;

    border-radius:5px;

    color:white;

    cursor:pointer;

    font-size:16px;

}

.cart{

    background:#0b0b24;

}

.wishlist{

    background:red;

}

button:hover{

    opacity:.9;

}

</style>

</head>
<body>

<h1>Our Products</h1>

<div class="container" id="products"></div>

<script>

const container=document.getElementById("products");

async function loadProducts(){

    try{

        const response=await fetch("http://localhost:3000/api/products");

        const products=await response.json();

        container.innerHTML="";

        products.forEach(product=>{

            container.innerHTML+=`

            <div class="card">

                <img src="${product.image_url}" alt="${product.product_name}">

                <div class="card-body">

                    <h2>${product.product_name}</h2>

                    <p class="price">Rs. ${product.price}</p>

                    <p class="stock">Stock : ${product.remaining_stock}</p>

                    <button class="cart"
                    onclick="addToCart(${product.product_id})">
                    Add To Cart
                    </button>

                    <button class="wishlist"
                    onclick="addToWishlist(${product.product_id})">
                    Wishlist
                    </button>

                </div>

            </div>

            `;

        });

    }

    catch(error){

        console.log(error);

        alert("Cannot load products.");

    }

}

loadProducts();

function addToCart(id){

    window.location.href=`cart.html?id=${id}`;

}

function addToWishlist(id){

    window.location.href=`wishlist.html?id=${id}`;

}

</script>

</body>
</html>
